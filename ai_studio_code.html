<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘 뭐 먹지? | 맞춤 식사 추천</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    :root {
      --primary: #ff6b35;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #212529;
      --text-sub: #6c757d;
      --border: #dee2e6;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      padding: 24px 16px;
    }

    .container { max-width: 740px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 28px; }

    .badge {
      display: inline-block;
      background: #fff0eb;
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    header h1 { font-size: 2rem; font-weight: 800; margin-bottom: 8px; }
    header p { color: var(--text-sub); font-size: 0.95rem; }

    .control-group {
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--radius);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
      margin-bottom: 16px;
    }

    .control-group h2 { font-size: 1.05rem; margin-bottom: 14px; }
    .control-group h2 small { font-weight: 400; color: var(--text-sub); font-size: 0.85rem; }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .button-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
    }

    .style-grid { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }

    .option-btn, .style-btn {
      padding: 13px 12px;
      border: 1.5px solid var(--border);
      background: #fff;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-main);
    }

    .option-btn:hover, .style-btn:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .option-btn.active, .style-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.25);
    }

    .text-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
    }

    .hidden { display: none !important; }
    .result-area { margin-top: 24px; }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .result-header h2 { font-size: 1.2rem; }

    .reroll-all-btn {
      padding: 10px 16px;
      background: #212529;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .reroll-all-btn:hover { background: #343a40; }

    .empty-guide {
      background: var(--card-bg);
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 40px 20px;
      text-align: center;
      color: var(--text-sub);
      font-size: 1rem;
      margin-bottom: 28px;
    }

    .cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .meal-card {
      background: var(--card-bg);
      border: 1.5px solid transparent;
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    /* 랜덤 셔플 중 & 확정 애니메이션 */
    .meal-card.rolling .meal-title {
      opacity: 0.6;
      transform: translateY(-2px);
    }

    .meal-card.picked {
      border-color: #ffd3c2;
      animation: popIn 0.28s ease;
    }

    @keyframes popIn {
      0% { transform: scale(0.97); }
      60% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .time-tag {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--primary);
      background: #fff0eb;
      padding: 4px 10px;
      border-radius: 8px;
    }

    .style-tag { font-size: 0.8rem; color: var(--text-sub); font-weight: 600; }

    .meal-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 8px;
      word-break: keep-all;
      transition: opacity 0.06s ease, transform 0.06s ease;
    }

    .meal-emoji { font-size: 1.3rem; line-height: 1; flex-shrink: 0; }
    .meal-desc { font-size: 0.9rem; color: var(--text-sub); margin-bottom: 16px; min-height: 44px; }

    .reroll-btn {
      width: 100%;
      padding: 9px;
      background: #f1f3f5;
      border: none;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #495057;
      cursor: pointer;
    }

    .reroll-btn:hover { background: #e9ecef; }

    .history-area {
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--radius);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
    }

    .history-list li {
      font-size: 0.9rem;
      color: var(--text-sub);
      padding-bottom: 8px;
      border-bottom: 1px solid #f1f3f5;
    }

    .history-list li strong { color: var(--text-main); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="badge">🍽️ DAILY MEAL PICKER</span>
      <h1>오늘 뭐 먹지?</h1>
      <p>원하는 시간대와 음식 스타일을 누르면 바로 메뉴를 추천해 드려요.</p>
    </header>

    <main>
      <section class="control-group">
        <h2>1. 언제 드시나요?</h2>
        <div class="button-group" id="time-selector">
          <button type="button" class="option-btn active" data-time="all">✨ 하루 3끼 모두</button>
          <button type="button" class="option-btn" data-time="breakfast">🌅 아침</button>
          <button type="button" class="option-btn" data-time="lunch">☀️ 점심</button>
          <button type="button" class="option-btn" data-time="dinner">🌙 저녁</button>
        </div>
      </section>

      <section class="control-group">
        <h2>2. 어떤 음식을 원하시나요? <small>(누르면 바로 추천됩니다)</small></h2>
        <div class="button-group style-grid" id="style-selector">
          <button type="button" class="style-btn" data-style="korean">🍚 한식</button>
          <button type="button" class="style-btn" data-style="western">🍝 양식</button>
          <button type="button" class="style-btn" data-style="chinese">🥟 중식</button>
          <button type="button" class="style-btn" data-style="japanese">🍣 일식</button>
          <button type="button" class="style-btn" data-style="all">🎲 전체 섞어서</button>
        </div>
      </section>

      <section id="result-area" class="result-area">
        <div class="result-header">
          <h2 id="result-title">오늘의 추천 메뉴</h2>
          <button type="button" id="recommend-btn" class="reroll-all-btn">🔄 다른 메뉴 추천받기</button>
        </div>

        <div id="empty-guide" class="empty-guide">
          👆 위에서 <strong>한식 · 양식 · 중식 · 일식</strong> 버튼을 눌러보세요!
        </div>

        <div id="cards-container" class="cards-container hidden"></div>
      </section>

      <section id="history-area" class="history-area hidden">
        <div class="section-header">
          <h3>최근 추천 기록</h3>
          <button type="button" id="clear-history" class="text-btn">기록 지우기</button>
        </div>
        <ul id="history-list" class="history-list"></ul>
      </section>
    </main>
  </div>
